# omgstop.org—per-virtual-host Nginx config for Synology Web Station.
#
# Installed by utils/deploy/install-nginx-conf.sh to:
#   /usr/local/etc/nginx/conf.d/<vhost-uuid>/user.conf
#
# Web Station includes this from inside the `server` block (the include sits
# next to the generated `root` and `index` directives), so everything here is
# in server context.
#
# NOTE ON add_header INHERITANCE: a `location` that declares its own
# add_header discards every add_header inherited from the server block. The
# cache locations below therefore use only `expires`, which does not reset
# inheritance, so the three security headers survive into them. Do not add an
# add_header to those blocks without restating the security headers too.

# Cloudflare terminates TLS at the edge and hands this server plain HTTP over
# the tunnel, so nginx believes the request scheme is http. Any absolute
# redirect it generates therefore comes out as http://omgstop.org/... — which
# bounces the visitor back out to Cloudflare, gets upgraded to https, and comes
# back in. Correct in the end, but two wasted round trips through a plaintext
# hop. Relative redirects have no scheme to get wrong.
absolute_redirect off;

# Web Station injects its own `error_page 404 /webstation_error_page_custom_default_404;`
# into the same server block, and DSM's wins at server level. nginx only
# inherits error_page from an outer level when the inner one defines none — so
# declaring it inside `location /` below makes ours authoritative for anything
# that block handles, which is every request that 404s.
error_page 404 /404.html;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Default to no-cache, then opt specific asset types back in below. Set at
# server level on purpose: HTML reached through the clean-URL rule below is
# served from inside `location /`, so a `location ~* \.html$` block would never
# match it and the pages would inherit whatever the asset rules said.
expires -1;

# /less -> /less/index.html, served directly.
#
# The obvious `try_files $uri $uri/ =404;` does NOT do this: the `$uri/` test
# matches the directory and nginx answers with a 301 to /less/, costing a round
# trip on the exact URL this whole site is built around. Naming index.html
# explicitly, before the directory test, serves it in place with no redirect.
# Verified against nginx:alpine with this site's real build output.
location / {
    error_page 404 /404.html;
    try_files $uri $uri/index.html $uri/ =404;
}

location ~* \.(css|svg)$ {
    expires 7d;
}

# Preview cards and icons are content-addressed by slug and only change when the
# entry does. They are fetched by unfurlers and crawlers, not by readers.
location ~* \.(png|jpg|jpeg|webp)$ {
    expires 30d;
}

# DSM's mime.types has no entry for .webmanifest, so it falls back to
# application/octet-stream. Chrome tolerates that; the spec does not.
location = /site.webmanifest {
    default_type application/manifest+json;
    expires 7d;
}

# Likewise the feed: served as text/xml by default, which some readers refuse.
location = /feed.xml {
    default_type application/atom+xml;
    expires 1h;
}

location ~* \.(txt|xml)$ {
    expires 1d;
}

# Don't serve dotfiles (.htaccess is not shipped, but belt and braces).
location ~ /\. {
    deny all;
    access_log off;
}
